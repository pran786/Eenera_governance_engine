version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - JWT_SECRET=super_secret_key_change_in_production
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    # 👇 keep ONLY for debugging (remove in production)
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # 👇 IMPORTANT: keep EMPTY (we use Nginx proxy)
        - REACT_APP_BACKEND_URL=
    container_name: frontend
    depends_on:
      - backend
    # ❌ no ports exposed (internal only)

  nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    ports:
      - "7070:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data: